#   - Если данные не подтверждены первичным источником — value: null
#     и source: null. В этом случае вопрос обязан присутствовать в
#     questions-open.md.
#   - Поле source ссылается на запись в data/sources.md (ключ)
#     ИЛИ содержит прямую ссылку на официальный документ с датой.
#   - Числа приводятся в исходных единицах источника; пересчёты
#     запрещены без отдельного поля converted_from.
#   - verified_at — дата последней ручной сверки (YYYY-MM-DD).

